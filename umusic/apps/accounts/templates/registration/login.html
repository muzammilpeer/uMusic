{% extends "base.html" %}
{% block title %}Log in · uMusic{% endblock %}
{% block content %}
  <section class="card">
    <h1>Log in to uMusic</h1>
    {% if form.errors %}<p class="error">The username or password was not accepted.</p>{% endif %}
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <input type="hidden" name="next" value="{{ next }}">
      <button type="submit">Log in</button>
    </form>
  </section>
{% endblock %}
